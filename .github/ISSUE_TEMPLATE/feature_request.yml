name: Feature proposal / 功能提议
description: Propose a focused capability or repository improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe a concrete use case and why the current design or implementation is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议方案
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Success criteria / 验收方式
      description: How would we verify that this improves behavior, quality, or usability?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs / 替代方案与取舍
